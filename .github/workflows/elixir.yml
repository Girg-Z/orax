name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }} / Oracle 26ai Free
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest and newest supported
          - elixir: '1.18'
            otp: '27'
          - elixir: '1.20'
            otp: '29'

    services:
      oracle:
        image: container-registry.oracle.com/database/free:latest-lite
        env:
          ORACLE_PWD: OraxCi1
        ports:
          - 1521:1521
        options: >-
          --health-cmd "lsnrctl status | grep -qi 'Service \"freepdb1\"' && echo 'select 1 from dual;' | sqlplus -L -s system/OraxCi1@//localhost:1521/FREEPDB1 | grep -Eq '^[[:space:]]*1[[:space:]]*$'"
          --health-interval 10s
          --health-timeout 10s
          --health-start-period 60s
          --health-retries 60

    env:
      MIX_ENV: test
      ORAX_TEST_HOST: 127.0.0.1
      ORAX_TEST_PORT: 1521
      ORAX_TEST_DATABASE: FREEPDB1

    steps:
    - uses: actions/checkout@v5

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: ${{ matrix.elixir }}
        otp-version: ${{ matrix.otp }}

    - name: Restore dependencies cache
      uses: actions/cache@v5
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-${{ hashFiles('mix.lock') }}
        restore-keys: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-

    - name: Install dependencies
      run: mix deps.get

    - name: Compile
      run: mix compile --warnings-as-errors

    - name: Create the test user
      run: |
        docker cp test/support/create_test_user.sql ${{ job.services.oracle.id }}:/tmp/
        docker exec ${{ job.services.oracle.id }} \
          sqlplus -s system/OraxCi1@//localhost:1521/FREEPDB1 @/tmp/create_test_user.sql

    - name: Run tests
      run: mix test --include oracle
